bigip/1:
  collection_interval: 60s
  data_types:
    f5.apm:
      enabled: false
    f5.cgnat:
      enabled: false
    f5.dns:
      enabled: false
    f5.dos:
      enabled: false
    f5.firewall:
      enabled: false
    f5.gtm:
      enabled: false
  endpoint: https://10.0.0.1
  password: ${env:BIGIP_PASSWORD_1}
  timeout: 60s
  tls:
    ca_file: null
    insecure_skip_verify: true
  username: admin
