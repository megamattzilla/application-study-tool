global:
  scrape_interval: 1m

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 1m
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'otel-exporter'
    scrape_interval: 1m
    static_configs:
      - targets: ['otel-collector-prom-exporter:9099']
    metric_relabel_configs:
    # copy exported_instance value to label instance
    - source_labels: [exported_instance]
      target_label: instance
    # remove exported_instance label
    - action: labeldrop
      regex: ^exported_instance$
    # copy exported_instance value to label job
    - source_labels: [exported_job]
      target_label: job
    # remove exported_instance label
    - action: labeldrop
      regex: ^exported_job$
    
  - job_name: 'otel-collector'
    scrape_interval: 30s
    static_configs:
      - targets: ['otel-collector:8888']